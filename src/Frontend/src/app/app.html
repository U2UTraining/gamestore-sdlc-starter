<div class="min-h-screen bg-base-200">
  <header class="navbar bg-base-100 shadow-sm">
    <div class="flex-1">
      <a routerLink="/games" class="btn btn-ghost text-xl">GameStore</a>
    </div>

    <nav class="flex-none gap-1">
      <a routerLink="/games" routerLinkActive="btn-active" class="btn btn-ghost btn-sm">Games</a>

      <a
        routerLink="/shopping-basket"
        routerLinkActive="btn-active"
        class="btn btn-ghost btn-sm"
      >
        Shopping Basket
        @if (shoppingBasket.gameCount() > 0) {
          <span class="badge badge-primary badge-sm">{{ shoppingBasket.gameCount() }}</span>
        }
      </a>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl p-4">
    <router-outlet />
  </main>

  <footer class="mx-auto max-w-5xl px-4 pb-8 text-xs opacity-60">
    Shopping as Customer {{ shoppingBasket.basket().customerId }}. There is no
    authentication in this demo.
  </footer>
</div>
